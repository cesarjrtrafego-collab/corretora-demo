<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema da Corretora · Proteção Veicular</title>
<style>
  :root{
    --navy:#0E1121;--navy2:#171c30;--navy3:#222842;--gold:#F1BC5E;--gold-d:#d69f3e;
    --bg:#eef1f7;--card:#fff;--line:#e6e9f2;--ink:#1b2033;--muted:#6b7386;--muted2:#9aa1b3;
    --green:#16a34a;--green-bg:#e7f6ec;--red:#e0483b;--red-bg:#fdecea;--blue:#2f6df6;--blue-bg:#e9f0fe;
    --amber:#e8912f;--amber-bg:#fdf1e0;
    --shadow:0 1px 2px rgba(16,20,40,.06),0 8px 24px rgba(16,20,40,.06);--radius:16px;
  }
  *{box-sizing:border-box}html,body{margin:0;padding:0}
  body{font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}

  .side{width:240px;background:linear-gradient(180deg,var(--navy),#0a0d18);color:#cfd4e6;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;padding:18px 14px;z-index:30}
  .brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px}
  .logo{width:44px;height:44px;border-radius:12px;background:var(--gold);color:var(--navy);font-weight:800;display:grid;place-items:center;font-size:17px;box-shadow:0 6px 18px rgba(241,188,94,.35)}
  .logo.haslogo{background:#fff;padding:3px}
  .logo img{width:100%;height:100%;object-fit:contain;border-radius:8px}
  .brand b{color:#fff;font-size:14px;display:block;line-height:1.15}.brand span{color:var(--gold);font-size:11px}
  .nav{display:flex;flex-direction:column;gap:3px}
  .nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:#c2c8dd;text-decoration:none;font-size:13.5px;font-weight:500;cursor:pointer;transition:.15s}
  .nav a .i{width:20px;text-align:center}
  .nav a .cnt{margin-left:auto;background:rgba(255,255,255,.12);color:#fff;font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:20px}
  .nav a:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav a.active{background:var(--gold);color:var(--navy);font-weight:700}.nav a.active .cnt{background:rgba(14,17,33,.18);color:var(--navy)}
  .side-foot{margin-top:auto;padding:12px 8px 2px;font-size:11px;color:#727a94;line-height:1.6}.side-foot b{color:#aeb5cc}
  .bkbtn{margin-top:8px;width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#dfe4f2;border-radius:9px;padding:8px;font-size:11.5px;font-weight:600;cursor:pointer}
  .bkbtn:hover{background:rgba(241,188,94,.2)}

  .main{margin-left:240px;min-width:0}
  .topbar{position:sticky;top:0;background:rgba(238,241,247,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 30px;display:flex;align-items:center;gap:14px;z-index:20}
  .topbar h1{font-size:18px;margin:0}.topbar .sub{color:var(--muted);font-size:12.5px;margin-top:1px}
  .top-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 13px;border-radius:10px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s;font-family:inherit}
  .btn:hover{border-color:var(--gold);color:var(--gold-d)}
  .btn.primary{background:var(--gold);border-color:var(--gold);color:var(--navy)}.btn.primary:hover{background:var(--gold-d);border-color:var(--gold-d);color:#fff}
  .btn.sm{padding:6px 10px;font-size:11.5px}
  .btn.danger{color:var(--red)}.btn.danger:hover{border-color:var(--red)}

  .wrap{padding:24px 30px 60px;max-width:1180px}
  .page{display:none;animation:fade .22s}.page.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .section-title{display:flex;align-items:center;gap:10px;margin:24px 0 13px;font-size:13.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
  .section-title:first-child{margin-top:2px}.section-title .bar{width:4px;height:16px;background:var(--gold);border-radius:3px}
  .hint{font-size:12px;color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0}
  .mini{font-size:11.5px;color:var(--muted2)}

  .grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
  .kpi .lbl{font-size:12px;color:var(--muted);font-weight:600}
  .kpi .val{font-size:22px;font-weight:800;margin-top:8px;letter-spacing:-.5px}.kpi .foot{font-size:11.5px;color:var(--muted2);margin-top:4px}
  .kpi.dark{background:linear-gradient(140deg,var(--navy),var(--navy3));color:#fff;border:none}.kpi.dark .lbl{color:var(--gold)}.kpi.dark .foot{color:#aab1c8}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
  .card h3{margin:0 0 3px;font-size:14.5px}.card .csub{color:var(--muted);font-size:12px;margin-bottom:12px}

  .bigbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:8px}
  .bigbtn{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 18px;cursor:pointer;text-align:center;transition:.15s}
  .bigbtn:hover{border-color:var(--gold);transform:translateY(-2px)}
  .bigbtn .ic{font-size:30px}.bigbtn b{display:block;margin-top:8px;font-size:14.5px}.bigbtn span{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}

  /* ===== dashboard ===== */
  .fdate{padding:7px 9px;border:1px solid var(--line);border-radius:9px;font-size:12.5px;font-family:inherit;background:#fafbfe;color:var(--ink)}
  .fdate:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(241,188,94,.2)}
  .fpre{border:1px solid var(--line);background:#fff;color:var(--muted);font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:20px;cursor:pointer;font-family:inherit}
  .fpre:hover{border-color:var(--gold);color:var(--gold-d)}
  .fpre.on{background:var(--navy);border-color:var(--navy);color:var(--gold)}
  .dash2{display:grid;grid-template-columns:1.05fr .95fr;gap:16px;align-items:start}
  @media(max-width:940px){.dash2{grid-template-columns:1fr}}
  .pend{display:flex;flex-direction:column;gap:8px}
  .pitem{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:11px;padding:10px 13px;font-size:12.8px;cursor:pointer;transition:.13s;background:#fafbfe}
  .pitem:hover{border-color:var(--gold);background:#fffdf7}
  .pitem .pic{font-size:17px;flex-shrink:0}
  .pitem .ptx{flex:1;min-width:0}.pitem .ptx b{color:var(--navy)}
  .pitem .ptag{flex-shrink:0}
  .pok{display:flex;align-items:center;gap:10px;background:var(--green-bg);border:1px solid #bfe5cc;border-radius:11px;padding:13px 15px;font-size:13px;color:#166534;font-weight:600}
  .chartrow{display:flex;align-items:flex-end;gap:8px;height:150px;padding:4px 2px 0}
  .cbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
  .cbar .bfill{width:100%;max-width:46px;background:linear-gradient(180deg,var(--gold),var(--gold-d));border-radius:7px 7px 3px 3px;min-height:3px;transition:.3s}
  .cbar .bval{font-size:10.5px;font-weight:700;color:var(--navy);white-space:nowrap}
  .cbar .blab{font-size:10.5px;color:var(--muted2);white-space:nowrap}
  .legend{display:flex;flex-direction:column;gap:7px;font-size:12px}
  .legend .li{display:flex;align-items:center;gap:8px}
  .legend .dot{width:11px;height:11px;border-radius:4px;flex-shrink:0}
  .legend .ln{flex:1;color:#454c60;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .legend .lv{font-weight:700;color:var(--navy)}
  .funrow{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px}
  .funrow .fl{width:78px;color:var(--muted);font-weight:600;flex-shrink:0}
  .funrow .ftrack{flex:1;background:#eef0f5;border-radius:8px;height:20px;overflow:hidden}
  .funrow .fbar{height:100%;border-radius:8px;min-width:2px;transition:.3s}
  .funrow .fv{width:26px;text-align:right;font-weight:800;color:var(--navy);flex-shrink:0}

  /* ===== botões Sim/Não do editor de proposta ===== */
  .cyn{gap:3px}
  .yn{border:1px solid var(--line);background:#fff;border-radius:6px;width:24px;height:24px;font-size:11px;font-weight:800;cursor:pointer;color:#b6bccb;flex-shrink:0;padding:0;line-height:1}
  .yn:hover{border-color:var(--gold)}
  .yn.s.on{background:var(--green);border-color:var(--green);color:#fff}
  .yn.n.on{background:var(--red);border-color:var(--red);color:#fff}
  .cpy{border:1px solid var(--line);background:#fff;border-radius:6px;font-size:10.5px;font-weight:700;cursor:pointer;color:var(--muted);padding:3px 8px;font-family:inherit;white-space:nowrap}
  .cpy:hover{border-color:var(--gold);color:var(--gold-d)}

  .tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow)}
  table{border-collapse:collapse;width:100%;font-size:13px;min-width:620px}
  thead th{background:#fafbfe;text-align:left;padding:11px 13px;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody td{padding:10px 13px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody tr:last-child td{border-bottom:none}tbody tr:hover{background:#fbfcfe}
  .r{text-align:right!important}
  .pos{color:var(--green);font-weight:700}.neg{color:var(--red);font-weight:700}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700}
  .b-ok{background:var(--green-bg);color:var(--green)}.b-wait{background:var(--amber-bg);color:var(--amber)}
  .b-red{background:var(--red-bg);color:var(--red)}.b-mut{background:#eef0f5;color:var(--muted)}.b-blue{background:var(--blue-bg);color:var(--blue)}
  .cli{display:flex;align-items:center;gap:10px}
  .av{width:32px;height:32px;border-radius:9px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-size:11px;font-weight:700;flex-shrink:0}
  .act{border:none;background:#eef0f5;color:var(--ink);font-weight:700;font-size:11px;padding:5px 10px;border-radius:8px;cursor:pointer;margin-left:5px;white-space:nowrap;font-family:inherit}
  .act:hover{background:var(--gold);color:var(--navy)}.act.g{background:var(--green-bg);color:var(--green)}.act.g:hover{background:var(--green);color:#fff}
  .act.r{background:var(--red-bg);color:var(--red)}.act.r:hover{background:var(--red);color:#fff}

  .inp label{display:block;font-size:12px;font-weight:600;color:var(--ink);margin-bottom:5px}
  .inp input,.inp select,.inp textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13px;font-family:inherit;background:#fafbfe;color:var(--ink)}
  .inp input:focus,.inp select:focus,.inp textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(241,188,94,.2)}
  .fr{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:11px}
  .fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px;margin-bottom:11px}
  @media(max-width:700px){.fr,.fr3{grid-template-columns:1fr}}

  .modalbg{position:fixed;inset:0;background:rgba(8,11,20,.55);z-index:150;display:none;align-items:flex-start;justify-content:center;padding:26px 16px;backdrop-filter:blur(2px);overflow:auto}
  .modalbg.on{display:flex}
  .modal{background:#fff;border-radius:16px;max-width:560px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden}
  .modal.wide{max-width:760px}
  .modal .mh{padding:15px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .modal .mh h3{margin:0;font-size:16px}.modal .mb{padding:18px 22px}.modal .mf{padding:13px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
  .x{border:none;background:none;font-size:18px;color:var(--muted);cursor:pointer;width:30px;height:30px;border-radius:8px}.x:hover{background:#eef0f5}

  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:11px;font-size:13.5px;box-shadow:0 12px 40px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.3s;z-index:300;display:flex;gap:9px;align-items:center;max-width:90vw}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}#toast .tk{color:var(--gold);font-weight:800}

  .alertbar{background:#fdf6e4;border:1px solid #ecd9a0;border-radius:12px;padding:11px 15px;font-size:12.5px;color:#7a5c14;margin-bottom:14px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .alertbar b{color:var(--navy)}

  .hamb{display:none;background:var(--card);border:1px solid var(--line);border-radius:10px;width:40px;height:40px;font-size:18px;cursor:pointer}
  .side-x{display:none}
  @media(max-width:820px){
    .side{transform:translateX(-100%);transition:transform .25s;box-shadow:0 0 50px rgba(0,0,0,.5);z-index:40}
    .side.open{transform:none}
    .side-x.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
    .main{margin-left:0}.wrap{padding:18px 14px 60px}
    .hamb{display:inline-flex;align-items:center;justify-content:center}
  }

  /* ===== editor de proposta ===== */
  .ops{display:grid;grid-template-columns:200px repeat(var(--nop,3),1fr);font-size:12.6px;min-width:700px}
  .ops>div{padding:5px 6px;border-bottom:1px solid #eef1f6;display:flex;align-items:center}
  .ops .rowlab{color:var(--muted);font-size:11.8px;font-weight:600}
  .ops .ophd{background:#f2f5fa;border-bottom:1px solid var(--line);flex-direction:column;align-items:stretch;gap:4px;padding:8px 6px}
  .ops .ophd input{font-weight:700;color:var(--navy);text-align:center}
  .ops input{width:100%;padding:5px 7px;border:1px solid transparent;border-radius:6px;font-size:12.6px;font-family:inherit;background:#fafbfe}
  .ops input:hover{border-color:var(--line)}
  .ops input:focus{outline:0;border-color:var(--gold);background:#fff}
  .ops .chk{justify-content:center;gap:5px;font-size:11px;color:var(--muted)}
  .scrollx{overflow-x:auto}
  table.ed{width:100%;border-collapse:collapse;font-size:12.6px;min-width:760px}
  table.ed th{background:#f2f5fa;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;padding:6px 5px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  table.ed td{padding:3px;border-bottom:1px solid #eef1f6}
  table.ed input{width:100%;padding:6px 8px;border:1px solid transparent;border-radius:7px;font-size:12.6px;font-family:inherit;background:#fafbfe}
  table.ed input:hover{border-color:var(--line)}
  table.ed input:focus{outline:0;border-color:var(--gold);background:#fff}
  .del{background:transparent;border:0;color:#c3c9d6;font-size:14px;cursor:pointer;padding:3px 6px}
  .del:hover{color:var(--red)}
  .fbadge{display:inline-block;font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px;letter-spacing:.4px}
  .fbadge.frota{background:var(--navy);color:var(--gold)}
  .fbadge.unico{background:#e7ecf5;color:var(--muted)}

  /* ===== documento proposta (overlay + print) ===== */
  #propOverlay{display:none;position:fixed;inset:0;background:rgba(10,13,22,.6);z-index:180;overflow:auto;padding:24px 14px}
  #propOverlay.on{display:block}
  .po-doc{max-width:860px;margin:0 auto;background:#fff;border-radius:10px;box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden}
  .po-bar{position:sticky;top:0;display:flex;gap:10px;justify-content:flex-end;background:#fff;padding:12px 20px;border-bottom:1px solid var(--line);z-index:5}
  .dochead{background:var(--navy);color:#fff;padding:24px 34px;display:flex;align-items:center;gap:17px}
  .dochead .lg{width:54px;height:54px;border:2px solid var(--gold);border-radius:13px;display:grid;place-items:center;color:var(--gold);font-family:Georgia,serif;font-weight:bold;font-size:16px;flex-shrink:0}
  .dochead .lg.lgimg{width:88px;height:58px;background:#fff;border-color:#fff;padding:5px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .dochead .lg.lgimg img{width:100%;height:100%;object-fit:contain}
  .dochead .t1{font-size:19px;font-weight:800}
  .dochead .t2{font-size:12px;color:var(--gold);margin-top:2px}
  .dochead .meta{margin-left:auto;text-align:right;font-size:11px;color:#c9d0e0;line-height:1.6}
  .dochead .meta b{color:#fff}
  .dsec{padding:18px 34px 4px}
  .dsec h3{font-size:13.5px;color:var(--navy);border-bottom:2px solid var(--gold);padding-bottom:5px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .dsec h3 .bdg{margin-left:auto}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:5px 24px;font-size:12.5px}
  .kv .it{display:flex;gap:8px;border-bottom:1px dashed #e8ebf2;padding:4px 0}
  .kv .k{color:var(--muted);font-size:11.5px;min-width:125px}
  .kv .v{font-weight:600}
  table.dt{width:100%;border-collapse:collapse;font-size:12px}
  table.dt th{background:var(--navy);color:#fff;font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;padding:6px 8px;text-align:left}
  table.dt td{padding:5px 8px;border-bottom:1px solid #eef1f6}
  table.dt tr:nth-child(even) td{background:#fafbfd}
  table.dt .r{text-align:right;white-space:nowrap}
  table.dt tfoot td{background:#f5f2ea;font-weight:700;color:var(--navy);border-top:2px solid var(--gold)}
  table.cmp{width:100%;border-collapse:collapse;font-size:11.8px}
  table.cmp th,table.cmp td{padding:5px 8px;border-bottom:1px solid #eef1f6}
  table.cmp thead th{background:var(--navy);color:#fff;font-size:11.5px;padding:8px;text-align:center}
  table.cmp thead th:first-child{text-align:left}
  table.cmp td.lab{color:#454c60;font-size:11.5px;background:#fafbfd;width:205px}
  table.cmp td.val{text-align:center;font-weight:600}
  table.cmp .yes{color:var(--green);font-weight:700}
  table.cmp .no{color:#98a0b0}
  table.cmp .nay{color:var(--red);font-weight:700}
  table.cmp .hi{background:#fdf7e8}
  table.cmp thead th.hi{background:#8a6412}
  .star{display:inline-block;font-size:9.5px;background:var(--gold);color:var(--navy);border-radius:10px;padding:1px 7px;font-weight:800;margin-left:5px;vertical-align:middle}
  table.pay{width:100%;border-collapse:collapse;font-size:12px}
  table.pay th{background:#f2f5fa;color:var(--navy);padding:6px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.3px;border-bottom:2px solid var(--gold)}
  table.pay td{padding:4px 8px;text-align:center;border-bottom:1px solid #eef1f6;white-space:nowrap}
  table.pay td:first-child{text-align:left;color:var(--muted);font-weight:600}
  table.pay .hi{background:#fdf7e8}
  table.pay .tot td{font-weight:800;color:var(--navy);background:#f5f2ea}
  .paynote{font-size:11px;color:var(--muted);margin-top:6px}
  .obsbox{background:#f7f9fc;border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:12px;color:#454c60;white-space:pre-wrap}
  .validity{background:#fdf6e4;border:1px solid #ecd9a0;border-radius:9px;padding:8px 13px;font-size:11.5px;color:#7a5c14;margin-top:10px}
  .validity b{color:var(--navy)}
  .docfoot{margin-top:16px;border-top:2px solid var(--navy);padding:13px 34px 22px;display:flex;justify-content:space-between;gap:14px;font-size:11px;color:var(--muted);flex-wrap:wrap}
  .docfoot b{color:var(--navy)}
  .demo-flag{display:none;background:repeating-linear-gradient(45deg,#F1BC5E,#F1BC5E 14px,#e0a63f 14px,#e0a63f 28px);color:#3a2a06;font-size:11px;font-weight:800;text-align:center;padding:5px 10px;letter-spacing:.3px;position:sticky;top:0;z-index:60}
  .demo-flag.on{display:block}

function num(v){if(v==null||v==="")return null;var s=String(v).trim().replace(/R\$\s?/,"");
  if(/,\d{1,2}$/.test(s))s=s.replace(/\./g,"").replace(",",".");        /* 1.989,86 */
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");          /* 98.610 (milhar sem centavos) */
  else s=s.replace(/,/g,"");
  var n=parseFloat(s);return isNaN(n)?null:n;}
function brl(n){return n==null?"—":"R$ "+n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});}

function hojeISO(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fmtData(iso){if(!iso)return "—";var p=String(iso).split("-");return p.length===3?(p[2]+"/"+p[1]+"/"+p[0]):iso;}
function parseDataBR(s){if(!s)return null;s=String(s).trim();

  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;return null;}
function diasAte(iso){if(!iso)return null;var d=new Date(iso+"T00:00:00"),h=new Date(hojeISO()+"T00:00:00");return Math.round((d-h)/86400000);}
function diasDesde(iso){var d=diasAte(iso);return d==null?null:-d;}

function dbDefault(){return {
  corretora:JSON.parse(JSON.stringify(CORRETORA_PADRAO)),
  clientes:[], propostas:[], problemas:[], fin:[],
  seqProposta:1, ultimoBackup:null
};}
function load(){try{DB=JSON.parse(localStorage.getItem(DBKEY))||dbDefault();}catch(e){DB=dbDefault();}
  ["clientes","propostas","problemas","fin"].forEach(function(k){if(!Array.isArray(DB[k]))DB[k]=[];});
  if(!DB.corretora)DB.corretora=dbDefault().corretora;
  if(!DB.corretora.nome)DB.corretora=JSON.parse(JSON.stringify(CORRETORA_PADRAO));
  if(DB.corretora.end==null)DB.corretora.end=CORRETORA_PADRAO.end;
  if(!DB.seqProposta)DB.seqProposta=1;}
function save(){try{localStorage.setItem(DBKEY,JSON.stringify(DB));}catch(e){toast("⚠️ Não consegui salvar: "+e.message);}refreshCounts();}
function backupJSON(){
  DB.ultimoBackup=hojeISO();save();
  var blob=new Blob([JSON.stringify(DB,null,1)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="Backup-Corretora-"+hojeISO()+".json";a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},4000);
  toast("💾 Backup salvo na pasta Downloads — guarde esse arquivo");}
$("fileRestore").addEventListener("change",function(){
  var f=this.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var d=JSON.parse(r.result);
    if(!d||!Array.isArray(d.clientes))throw new Error("arquivo não parece um backup válido");
    DB=d;save();go("inicio");toast("✅ Backup restaurado: "+DB.clientes.length+" clientes, "+DB.propostas.length+" propostas");
  }catch(e){toast("⚠️ "+e.message);}};
  r.readAsText(f,"utf-8");this.value="";});

function alertas(){
  var out=[];
  var renov=DB.clientes.filter(function(c){var d=diasAte(c.renovacao);return d!=null&&d>=0&&d<=30;});
  if(renov.length)out.push({ic:"🔄",txt:"<b>"+renov.length+" renovação(ões)</b> nos próximos 30 dias",go:"clientes"});
  var inad=DB.clientes.filter(function(c){return c.status==="inadimplente"||c.status==="atrasado";});
  if(inad.length)out.push({ic:"⚠️",txt:"<b>"+inad.length+" cliente(s)</b> com pagamento atrasado ou inadimplente",go:"clientes"});
  var parados=DB.problemas.filter(function(p){return p.status!=="resolvido"&&p.status!=="negado"&&(diasDesde(p.ultAtual||p.data)||0)>=5;});
  if(parados.length)out.push({ic:"🚨",txt:"<b>"+parados.length+" problema(s) sem movimento há 5+ dias</b> — dê um retorno",go:"problemas"});
  var venc=DB.propostas.filter(function(p){var d=diasAte(p.validadeAte);return p.status==="enviada"&&d!=null&&d<0;});
  if(venc.length)out.push({ic:"⏳",txt:"<b>"+venc.length+" proposta(s) enviada(s) com validade vencida</b> — cobre uma resposta",go:"propostas"});
  var bk=DB.ultimoBackup?diasDesde(DB.ultimoBackup):null;
  if((bk==null&&(DB.clientes.length||DB.propostas.length))||bk>=7)out.push({ic:"💾",txt:"<b>Backup:</b> "+(bk==null?"você ainda não fez nenhum":"o último foi há "+bk+" dias")+" — clique em <b>Salvar backup</b> no menu",go:"config"});
  return out;
}
/* pendências detalhadas (com nome e ação) */
function pendencias(){
  var out=[];
  DB.clientes.forEach(function(c){
    var d=diasAte(c.renovacao);
    if(d!=null&&d>=0&&d<=30)out.push({ic:"🔄",html:"Renovação de <b>"+esc(c.nome)+"</b> — "+(d===0?"é <b>HOJE</b>":"em <b>"+d+" dia"+(d>1?"s":"")+"</b>")+" ("+fmtData(c.renovacao)+")",tag:d<=7?'<span class="badge b-red">urgente</span>':'<span class="badge b-wait">'+d+'d</span>',go:"clientes",ord:d});
    if(d!=null&&d<0&&c.status!=="inativo")out.push({ic:"🔄",html:"Renovação de <b>"+esc(c.nome)+"</b> <b>VENCEU</b> em "+fmtData(c.renovacao),tag:'<span class="badge b-red">venceu</span>',go:"clientes",ord:-100+d});
  });
  DB.clientes.forEach(function(c){
    if(c.status==="inadimplente")out.push({ic:"💸",html:"<b>"+esc(c.nome)+"</b> está <b>inadimplente</b>"+(c.mensalidade?" ("+brl(c.mensalidade)+"/mês)":""),tag:'<span class="badge b-red">cobrar</span>',go:"clientes",ord:-50});
    else if(c.status==="atrasado")out.push({ic:"⚠️",html:"<b>"+esc(c.nome)+"</b> está com pagamento <b>atrasado</b>",tag:'<span class="badge b-wait">atrasado</span>',go:"clientes",ord:-20});
  });
  DB.problemas.forEach(function(p){
    if(p.status==="resolvido"||p.status==="negado")return;
    var dm=diasDesde(p.ultAtual||p.data)||0;
    if(dm>=5)out.push({ic:"🚨",html:esc(p.tipo)+" de <b>"+esc(p.cliente)+"</b> está <b>parado há "+dm+" dias</b> — dê um retorno",tag:'<span class="badge b-red">parado</span>',go:"problemas",ord:-80-dm});
  });
  DB.propostas.forEach(function(p){
    if(p.status!=="enviada")return;
    var d=diasAte(p.validadeAte);
    if(d!=null&&d<0)out.push({ic:"⏳",html:"Proposta <b>Nº "+esc(p.num)+"</b> de <b>"+esc(p.cliente.nome)+"</b> passou da validade — cobre uma resposta",tag:'<span class="badge b-wait">sem resposta</span>',go:"propostas",ord:-10});
  });
  var bk=DB.ultimoBackup?diasDesde(DB.ultimoBackup):null;
  if((bk==null&&(DB.clientes.length||DB.propostas.length))||bk>=7)out.push({ic:"💾",html:"<b>Backup:</b> "+(bk==null?"você ainda não fez nenhum":"o último foi há "+bk+" dias")+" — clique em <b>Salvar backup</b>",tag:'<span class="badge b-mut">1 clique</span>',go:"config",ord:50});
  out.sort(function(a,b){return a.ord-b.ord;});
  return out;
}
function mesesAtras(n){var d=new Date();d.setDate(1);d.setMonth(d.getMonth()-n);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
var DONUT_CORES=["#F1BC5E","#0E1121","#2f6df6","#16a34a","#e8912f","#9aa1b3"];

/* ---- filtro de período do painel ---- */
var FILTRO={de:null,ate:null,preset:"mes"};
function isoDe(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function filtroDefault(){var h=hojeISO();FILTRO={de:h.slice(0,7)+"-01",ate:h,preset:"mes"};}
function inPer(d){return !!d&&d>=FILTRO.de&&d<=FILTRO.ate;}
function diffDias(a,b){return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000);}
function filtroPreset(p){
  if(p==="mes")filtroDefault();
  else if(p==="anterior"){var d=new Date();d.setDate(1);d.setDate(0);var fim=isoDe(d);FILTRO={de:fim.slice(0,7)+"-01",ate:fim,preset:"anterior"};}
  else if(p==="ano"){FILTRO={de:hojeISO().slice(0,4)+"-01-01",ate:hojeISO(),preset:"ano"};}
  else{var min=null;
    DB.fin.forEach(function(l){if(l.data&&(!min||l.data<min))min=l.data;});
    DB.propostas.forEach(function(pp){if(pp.data&&(!min||pp.data<min))min=pp.data;});
    FILTRO={de:min||hojeISO().slice(0,7)+"-01",ate:hojeISO(),preset:"tudo"};}
  go("inicio");
}
PAGES.inicio=function(){
  if(!FILTRO.de||!FILTRO.ate)filtroDefault();
  /* ---- KPIs do período ---- */
  var finPer=DB.fin.filter(function(l){return inPer(l.data);});
  var recebido=finPer.filter(function(l){return l.tipo!=="saida";}).reduce(function(a,l){return a+(l.valor||0);},0);
  var saidasPer=finPer.filter(function(l){return l.tipo==="saida";}).reduce(function(a,l){return a+(l.valor||0);},0);
  var comis=finPer.filter(function(l){return l.tipo==="comissao";}).reduce(function(a,l){return a+(l.valor||0);},0);
  var abertosProb=DB.problemas.filter(function(x){return x.status!=="resolvido"&&x.status!=="negado";}).length;
  var propsPer=DB.propostas.filter(function(p){return inPer(p.data);});
  var enviadas=propsPer.filter(function(p){return p.status==="enviada";}).length;
  var fechadas=propsPer.filter(function(p){return p.status==="fechada";}).length;
  var recusadas=propsPer.filter(function(p){return p.status==="recusada";}).length;
  var taxa=(fechadas+recusadas)>0?Math.round(fechadas/(fechadas+recusadas)*100)+"%":"—";
  var protegido=0;
  DB.clientes.forEach(function(c){(c.veiculos||[]).forEach(function(v){var f=num(v.fipe);if(f)protegido+=f;});});
  var mensalRec=DB.clientes.filter(function(c){return c.status!=="inativo"&&c.mensalidade;}).reduce(function(a,c){return a+c.mensalidade;},0);

  /* ---- barra do filtro de período ---- */
  var temDados=DB.clientes.length||DB.propostas.length||DB.fin.length;
  var h="";
  if(temDados){
    h+='<div class="card" style="padding:12px 16px;margin-bottom:16px;display:flex;gap:9px;align-items:center;flex-wrap:wrap">'+
    '<b style="font-size:12.5px;color:var(--navy)">📅 Período:</b>'+
    '<input type="date" class="fdate" value="'+FILTRO.de+'" onchange="FILTRO.de=this.value;FILTRO.preset=\'\';go(\'inicio\')">'+
    '<span class="mini">até</span>'+
    '<input type="date" class="fdate" value="'+FILTRO.ate+'" onchange="FILTRO.ate=this.value;FILTRO.preset=\'\';go(\'inicio\')">'+
    '<span style="flex:1"></span>'+
    [["mes","Este mês"],["anterior","Mês passado"],["ano","Este ano"],["tudo","Tudo"]].map(function(p){
      return '<button class="fpre'+(FILTRO.preset===p[0]?" on":"")+'" onclick="filtroPreset(\''+p[0]+'\')">'+p[1]+'</button>';}).join("")+
    '</div>';}

  h+='<div class="grid kpis">'+
    '<div class="kpi dark"><div class="lbl">🛡️ Valor protegido da carteira</div><div class="val">'+(protegido?brl0(protegido):"—")+'</div><div class="foot">soma FIPE dos veículos dos clientes</div></div>'+
    '<div class="kpi"><div class="lbl">👥 Clientes ativos</div><div class="val">'+DB.clientes.filter(function(c){return c.status!=="inativo";}).length+'</div><div class="foot">'+DB.clientes.filter(function(c){return c.status==="inadimplente"||c.status==="atrasado";}).length+' com pendência de pagamento</div></div>'+
    '<div class="kpi"><div class="lbl">💵 Mensalidades da carteira</div><div class="val">'+(mensalRec?brl0(mensalRec):"—")+'</div><div class="foot">por mês, clientes ativos</div></div>'+
    '<div class="kpi"><div class="lbl">✅ Recebido no período</div><div class="val">'+brl0(recebido)+'</div><div class="foot">comissões: '+brl0(comis)+' · saídas: '+brl0(saidasPer)+'</div></div>'+
    '<div class="kpi"><div class="lbl">🎯 Aproveitamento de propostas</div><div class="val">'+taxa+'</div><div class="foot">'+fechadas+' fechada(s) · '+enviadas+' aguardando · no período</div></div></div>';

  /* ---- onboarding se vazio ---- */
  if(!temDados){
    h+='<div class="card" style="margin-top:16px;border-left:4px solid var(--gold)"><h3>👋 Bem-vindo! Por onde começar:</h3>'+
    '<div class="csub" style="margin-top:8px;line-height:1.9">1️⃣ Vá em <b>Configurações</b> e preencha os dados da corretora (vão no cabeçalho das propostas).<br>'+
    '2️⃣ Em <b>Clientes</b>, use <b>Importar planilha</b> pra trazer sua lista de uma vez — ou cadastre um a um.<br>'+
    '3️⃣ Aperte <b>Nova proposta</b> e gere seu primeiro comparativo em PDF. 🎉<br><br>'+
    '<span class="mini">Assim que houver dados, esta tela vira o seu painel: pendências do dia, gráficos de recebimento, carteira por operadora e o funil de propostas.</span></div></div>';
    return h;}

  /* ---- pendências de hoje + gráficos ---- */
  var pend=pendencias();
  h+='<div class="dash2" style="margin-top:16px"><div>';
  h+='<div class="card"><h3>📋 Para hoje — '+fmtData(hojeISO())+'</h3><div class="csub">O sistema olha seus dados e lista o que precisa de você.</div><div class="pend">';
  if(!pend.length)h+='<div class="pok">✅ Nenhuma pendência — carteira em dia. Bom trabalho!</div>';
  else pend.slice(0,9).forEach(function(p){
    h+='<div class="pitem" onclick="go(\''+p.go+'\')"><span class="pic">'+p.ic+'</span><span class="ptx">'+p.html+'</span><span class="ptag">'+p.tag+'</span></div>';});
  if(pend.length>9)h+='<div class="mini" style="text-align:center">… e mais '+(pend.length-9)+' pendência(s)</div>';
  h+='</div></div>';

  /* funil de propostas (do período) */
  var funil=[["Rascunho",propsPer.filter(function(p){return p.status==="rascunho";}).length,"#9aa1b3"],
    ["Enviadas",enviadas,"#2f6df6"],["Fechadas",fechadas,"#16a34a"],["Recusadas",recusadas,"#e0483b"]];
  var fmax=Math.max.apply(null,funil.map(function(f){return f[1];}).concat([1]));
  h+='<div class="card" style="margin-top:16px"><h3>📄 Funil de propostas</h3><div class="csub">Orçamentos feitos no período escolhido.</div>';
  funil.forEach(function(f){h+='<div class="funrow"><span class="fl">'+f[0]+'</span><div class="ftrack"><div class="fbar" style="width:'+Math.round(f[1]/fmax*100)+'%;background:'+f[2]+'"></div></div><span class="fv">'+f[1]+'</span></div>';});
  h+='</div></div><div>';

  /* recebimentos no período (por dia se período curto, por mês se longo) */
  var porDia=diffDias(FILTRO.de,FILTRO.ate)<=31;
  var buckets=[],vals=[];
  if(porDia){
    var d=new Date(FILTRO.de+"T00:00:00");
    for(var s=0;s<62;s++){var iso=isoDe(d);buckets.push(iso);if(iso>=FILTRO.ate)break;d.setDate(d.getDate()+1);}
    vals=buckets.map(function(b){return finPer.filter(function(l){return l.tipo!=="saida"&&l.data===b;}).reduce(function(a,l){return a+(l.valor||0);},0);});
  }else{
    var m=FILTRO.de.slice(0,7),fim=FILTRO.ate.slice(0,7),guard=0;
    while(m<=fim&&guard<36){buckets.push(m);var pm=m.split("-");var dd=new Date(+pm[0],+pm[1],1);m=dd.getFullYear()+"-"+String(dd.getMonth()+1).padStart(2,"0");guard++;}
    vals=buckets.map(function(b){return finPer.filter(function(l){return l.tipo!=="saida"&&(l.data||"").slice(0,7)===b;}).reduce(function(a,l){return a+(l.valor||0);},0);});
  }
  var vmax=Math.max.apply(null,vals.concat([1]));
  var muitos=buckets.length>16;
  h+='<div class="card"><h3>💰 Recebimentos no período</h3><div class="csub">Entradas + comissões de '+fmtData(FILTRO.de)+' a '+fmtData(FILTRO.ate)+(porDia?' · por dia':' · por mês')+'.</div>';
  if(!vals.some(function(v){return v>0;}))h+='<div class="mini" style="padding:20px 0;text-align:center">Sem lançamentos nesse período — registre (ou importe) no <b>Financeiro</b> e o gráfico se monta sozinho.</div>';
  else{h+='<div class="chartrow">';
    buckets.forEach(function(b,i){
      var lab=porDia?b.slice(8):fmtMes(b);
      h+='<div class="cbar">'+(muitos?'':'<span class="bval">'+(vals[i]?brl0(vals[i]):"")+'</span>')+
        '<div class="bfill" title="'+(porDia?fmtData(b):fmtMes(b))+': '+brl(vals[i])+'" style="height:'+Math.max(Math.round(vals[i]/vmax*100),2)+'%"></div>'+
        '<span class="blab">'+((muitos&&i%2===1&&i!==buckets.length-1)?"":lab)+'</span></div>';});
    h+='</div>';}
  h+='</div>';

  /* carteira por operadora */
  var porOp={};
  DB.clientes.forEach(function(c){if(c.status==="inativo")return;var o=(c.operadora||"").trim()||"(sem operadora)";porOp[o]=(porOp[o]||0)+1;});
  var ops=Object.keys(porOp).map(function(k){return [k,porOp[k]];}).sort(function(a,b){return b[1]-a[1];});
  if(ops.length>5){var outros=ops.slice(4).reduce(function(a,o){return a+o[1];},0);ops=ops.slice(0,4);ops.push(["Outras",outros]);}
  h+='<div class="card" style="margin-top:16px"><h3>🤝 Carteira por operadora</h3><div class="csub">Onde estão os seus clientes.</div>';
  if(!ops.length)h+='<div class="mini" style="padding:14px 0;text-align:center">Cadastre a operadora de cada cliente pra ver a divisão aqui.</div>';
  else{
    var tot=ops.reduce(function(a,o){return a+o[1];},0),acc=0,C=2*Math.PI*40,segs="";
    ops.forEach(function(o,i){var frac=o[1]/tot;
      segs+='<circle r="40" cx="55" cy="55" fill="none" stroke="'+DONUT_CORES[i%6]+'" stroke-width="17" stroke-dasharray="'+(frac*C).toFixed(2)+' '+C.toFixed(2)+'" stroke-dashoffset="'+(-acc*C).toFixed(2)+'" transform="rotate(-90 55 55)"/>';
      acc+=frac;});
    h+='<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><svg width="110" height="110" viewBox="0 0 110 110">'+segs+
      '<text x="55" y="52" text-anchor="middle" font-size="19" font-weight="800" fill="#0E1121">'+tot+'</text><text x="55" y="67" text-anchor="middle" font-size="8.5" fill="#6b7386">clientes</text></svg>'+
      '<div class="legend" style="flex:1;min-width:150px">'+ops.map(function(o,i){return '<div class="li"><span class="dot" style="background:'+DONUT_CORES[i%6]+'"></span><span class="ln">'+esc(o[0])+'</span><span class="lv">'+o[1]+'</span></div>';}).join("")+'</div></div>';}
  h+='</div></div></div>';
  return h;
};

var cliBusca="";
PAGES.clientes=function(){
  var h='<div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap">'+
    '<input class="btn" style="min-width:230px;cursor:text" placeholder="🔎 Buscar por nome, placa, documento..." value="'+esc(cliBusca)+'" oninput="cliBusca=this.value;filtraCli()">'+
    '<button class="btn primary" onclick="editCliente()">+ Novo cliente</button>'+

    '<div class="tbl-wrap"><table><thead><tr><th>Cliente</th><th>Contato</th><th>Veículo(s)</th><th>Operadora</th><th>Mensalidade</th><th>Renovação</th><th>Situação</th><th></th></tr></thead><tbody id="cliBody"></tbody></table></div>'+

function filtraCli(){
  var q=(cliBusca||"").toLowerCase();
  var list=DB.clientes.filter(function(c){
    if(!q)return true;
    return [c.nome,c.doc,c.tel,c.operadora,(c.veiculos||[]).map(function(v){return v.placa+" "+v.modelo;}).join(" ")].join(" ").toLowerCase().indexOf(q)>=0;});
  var b=$("cliBody");if(!b)return;
  if(!list.length){b.innerHTML='<tr><td colspan="8" style="color:#9aa1b3">'+(DB.clientes.length?"Nenhum cliente encontrado nessa busca.":"Nenhum cliente ainda — use <b>Importar planilha</b> ou <b>+ Novo cliente</b>.")+'</td></tr>';return;}
  b.innerHTML=list.map(function(c){
    var d=diasAte(c.renovacao);
    var ren=c.renovacao?(fmtData(c.renovacao)+(d!=null&&d>=0&&d<=30?' <span class="badge b-wait">'+d+'d</span>':(d!=null&&d<0?' <span class="badge b-red">venceu</span>':''))):"—";
    var veic=(c.veiculos||[]).length?((c.veiculos||[]).length===1?(c.veiculos[0].placa||c.veiculos[0].modelo||"1 veículo"):((c.veiculos||[]).length+" veículos")):"—";
    return '<tr><td class="cli"><div class="av">'+ini(c.nome)+'</div><div>'+esc(c.nome)+'<div class="mini">'+esc(c.doc||"")+'</div></div></td>'+
      '<td>'+esc(c.tel||"—")+'</td><td>'+esc(veic)+'</td><td>'+esc(c.operadora||"—")+'</td>'+
      '<td>'+(c.mensalidade!=null?brl(c.mensalidade):"—")+'</td><td>'+ren+'</td><td>'+stBadge(c.status)+'</td>'+
      '<td><button class="act" onclick="editCliente(\''+c.id+'\')">Abrir</button><button class="act r" onclick="delCliente(\''+c.id+'\')">✕</button></td></tr>';
  }).join("");
}

    '<div class="inp"><label>E-mail</label><input id="cMail" value="'+esc(c.mail||"")+'"></div></div>'+
    '<div class="fr3"><div class="inp"><label>Operadora atual</label><input id="cOper" value="'+esc(c.operadora)+'"></div>'+
    '<div class="inp"><label>Mensalidade (R$)</label><input id="cMens" value="'+(c.mensalidade!=null?esc(String(c.mensalidade).replace(".",",")):"")+'"></div>'+
    '<div class="inp"><label>Renovação (dd/mm/aaaa)</label><input id="cRen" value="'+esc(c.renovacao?fmtData(c.renovacao):"")+'"></div></div>'+
    '<div class="fr"><div class="inp"><label>Situação de pagamento</label><select id="cSt">'+
      Object.keys(STATUS).map(function(k){return '<option value="'+k+'"'+(c.status===k?" selected":"")+'>'+STATUS[k][1]+'</option>';}).join("")+'</select></div>'+
    '<div class="inp"><label>Observações</label><input id="cObs" value="'+esc(c.obs||"")+'"></div></div>'+

  $("mfoot").innerHTML='<button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="saveCliente('+(id?('\''+id+'\''):'null')+')">💾 Salvar cliente</button>';
  $("modal").classList.add("on");

function addVeicRow(){var tb=$("cvTable").tBodies[0];var tr=document.createElement("tr");
  tr.innerHTML='<td><input class="cvMarca" placeholder="Marca"></td><td><input class="cvModelo" placeholder="Modelo"></td><td style="width:90px"><input class="cvAno" placeholder="Ano"></td><td style="width:110px"><input class="cvPlaca" placeholder="Placa"></td><td style="width:120px"><input class="cvFipe" placeholder="FIPE R$"></td><td style="width:26px"><button class="del" onclick="this.closest(\'tr\').remove()">✕</button></td>';
  tb.appendChild(tr);}
function saveCliente(id){
  var nome=$("cNome").value.trim();if(!nome){toast("⚠️ O nome é obrigatório");return;}
  var veics=[].map.call($("cvTable").tBodies[0].rows,function(tr){
    return {marca:tr.querySelector(".cvMarca").value.trim(),modelo:tr.querySelector(".cvModelo").value.trim(),
      ano:tr.querySelector(".cvAno").value.trim(),placa:tr.querySelector(".cvPlaca").value.trim(),fipe:tr.querySelector(".cvFipe").value.trim()};
  }).filter(function(v){return v.marca||v.modelo||v.placa||v.fipe;});
  var obj={id:id||uid(),nome:nome,doc:$("cDoc").value.trim(),tel:$("cTel").value.trim(),mail:$("cMail").value.trim(),
    operadora:$("cOper").value.trim(),mensalidade:num($("cMens").value),renovacao:parseDataBR($("cRen").value)||"",
    status:$("cSt").value,obs:$("cObs").value.trim(),veiculos:veics};
  if(id){var i=DB.clientes.findIndex(function(x){return x.id===id;});DB.clientes[i]=obj;}else DB.clientes.push(obj);
  save();closeM();go("clientes");toast("✅ Cliente salvo — tudo gravado neste computador");
}
function delCliente(id){var c=DB.clientes.find(function(x){return x.id===id;});
  if(!confirm("Remover o cliente \""+c.nome+"\"?\n(As propostas e problemas dele não são apagados.)"))return;
  DB.clientes=DB.clientes.filter(function(x){return x.id!==id;});save();go("clientes");toast("Cliente removido");}

/* ====== IMPORTAÇÃO DE PLANILHA (colar do Excel ou CSV) ====== */
var IMP={rows:[],headers:[]};
function abrirImport(){
  $("modalBox").className="modal wide";
  $("mtitle").textContent="Importar planilha de clientes";
  $("mbody").innerHTML=
    '<div class="alertbar" style="margin-bottom:12px">📋 <b>Jeito mais fácil:</b> abra a sua planilha no Excel, selecione as células (com a linha de título), copie (Ctrl+C) e <b>cole aqui embaixo</b> (Ctrl+V). Ou clique em "Escolher arquivo CSV".</div>'+
    '<div class="inp"><label>Cole aqui os dados copiados do Excel</label><textarea id="impTxt" rows="6" placeholder="Cole aqui..." oninput="lerImport(this.value)"></textarea></div>'+
    '<div style="margin:9px 0"><button class="btn sm" onclick="$(\'fileImport\').click()">📁 …ou escolher arquivo CSV</button></div>'+
    '<div id="impMap"></div>';
  $("mfoot").innerHTML='<button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" id="impGo" style="display:none" onclick="fazImport()">⬇ Importar</button>';
  $("modal").classList.add("on");
}
$("fileImport").addEventListener("change",function(){var f=this.files[0];if(!f)return;
  var r=new FileReader();r.onload=function(){$("impTxt").value=r.result;lerImport(r.result);};r.readAsText(f,"utf-8");this.value="";});
function splitLinha(l,sep){ // split simples respeitando aspas
  var out=[],cur="",q=false;
  for(var i=0;i<l.length;i++){var ch=l[i];
    if(ch==='"'){q=!q;continue;}
    if(ch===sep&&!q){out.push(cur);cur="";}else cur+=ch;}
  out.push(cur);return out.map(function(s){return s.trim();});
}
function lerImport(txt){
  txt=(txt||"").replace(/\r/g,"");var linhas=txt.split("\n").filter(function(l){return l.trim();});
  if(linhas.length<1){$("impMap").innerHTML="";$("impGo").style.display="none";return;}
  var sep=linhas[0].indexOf("\t")>=0?"\t":(linhas[0].split(";").length>linhas[0].split(",").length?";":",");
  var rows=linhas.map(function(l){return splitLinha(l,sep);});
  var ncol=Math.max.apply(null,rows.map(function(r){return r.length;}));
  rows=rows.map(function(r){while(r.length<ncol)r.push("");return r;});
  IMP.headers=rows[0];IMP.rows=rows.slice(1);
  if(!IMP.rows.length){IMP.rows=rows;IMP.headers=rows[0].map(function(_,i){return "Coluna "+(i+1);});}
  var CAMPOS=[["ignorar","(ignorar)"],["nome","Nome / Razão social"],["doc","CNPJ / CPF"],["tel","Telefone"],["mail","E-mail"],
    ["operadora","Operadora"],["mensalidade","Mensalidade R$"],["renovacao","Renovação (data)"],["status","Situação"],
    ["placa","Placa"],["marca","Marca"],["modelo","Modelo"],["ano","Ano"],["fipe","FIPE R$"],["obs","Observações"]];
  function adiv(hdr){var h=hdr.toLowerCase();
    if(/raz|nome|cliente|coop/.test(h))return "nome";if(/cnpj|cpf|doc/.test(h))return "doc";
    if(/fone|cel|whats|contato/.test(h))return "tel";if(/mail/.test(h))return "mail";
    if(/oper|assoc|coop.*tiva|segurad/.test(h))return "operadora";if(/mensal|valor/.test(h))return "mensalidade";
    if(/renov|venc/.test(h))return "renovacao";if(/situa|status|pagament/.test(h))return "status";
    if(/placa/.test(h))return "placa";if(/marca/.test(h))return "marca";if(/modelo/.test(h))return "modelo";
    if(/ano/.test(h))return "ano";if(/fipe/.test(h))return "fipe";if(/obs/.test(h))return "obs";return "ignorar";}
  var mapa='<div class="section-title" style="margin:10px 0 8px"><span class="bar"></span>Diga o que é cada coluna <span class="hint">— eu já tentei adivinhar</span></div>'+
    '<div class="scrollx"><table class="ed" style="min-width:520px"><thead><tr>'+
    IMP.headers.map(function(hd,i){return '<th><select class="impSel" data-i="'+i+'" style="width:100%;padding:5px;border:1px solid var(--line);border-radius:7px;font-family:inherit;font-size:11.5px">'+
      CAMPOS.map(function(cp){return '<option value="'+cp[0]+'"'+(adiv(hd)===cp[0]?" selected":"")+'>'+cp[1]+'</option>';}).join("")+'</select><div class="mini" style="margin-top:3px">'+esc(hd)+'</div></th>';}).join("")+
    '</tr></thead><tbody>'+
    IMP.rows.slice(0,4).map(function(r){return '<tr>'+r.map(function(cel){return '<td style="padding:6px;font-size:12px;color:#454c60">'+esc(cel)+'</td>';}).join("")+'</tr>';}).join("")+
    '</tbody></table></div><div class="mini" style="margin-top:6px">Mostrando as 4 primeiras linhas · total a importar: <b>'+IMP.rows.length+'</b></div>';
  $("impMap").innerHTML=mapa;$("impGo").style.display="inline-flex";
}
function fazImport(){
  var mapa=[].map.call(document.querySelectorAll(".impSel"),function(s){return s.value;});
  var novos=0,atualizados=0;
  IMP.rows.forEach(function(r){
    var o={},v={};
    mapa.forEach(function(campo,i){if(campo==="ignorar")return;var val=(r[i]||"").trim();if(!val)return;
      if(["placa","marca","modelo","ano","fipe"].indexOf(campo)>=0)v[campo]=val;else o[campo]=val;});
    if(!o.nome)return;
    var st="novo";var sl=(o.status||"").toLowerCase();
    if(/inad/.test(sl))st="inadimplente";else if(/atras|venc|pend/.test(sl))st="atrasado";else if(/dia|ok|pago|ativ/.test(sl))st="emdia";else if(/inativ|cancel/.test(sl))st="inativo";
    var cli={id:uid(),nome:o.nome,doc:o.doc||"",tel:o.tel||"",mail:o.mail||"",operadora:o.operadora||"",
      mensalidade:num(o.mensalidade),renovacao:parseDataBR(o.renovacao)||"",status:st,obs:o.obs||"",
      veiculos:(v.placa||v.modelo||v.marca||v.fipe)?[{marca:v.marca||"",modelo:v.modelo||"",ano:v.ano||"",placa:v.placa||"",fipe:v.fipe||""}]:[]};
    var ja=DB.clientes.find(function(x){return (x.doc&&cli.doc&&x.doc.replace(/\D/g,"")===cli.doc.replace(/\D/g,""))||x.nome.toLowerCase()===cli.nome.toLowerCase();});
    if(ja){ // atualiza sem apagar o que já existe
      ["doc","tel","mail","operadora","obs"].forEach(function(k){if(cli[k])ja[k]=cli[k];});
      if(cli.mensalidade!=null)ja.mensalidade=cli.mensalidade;
      if(cli.renovacao)ja.renovacao=cli.renovacao;
      if(o.status)ja.status=st;
      cli.veiculos.forEach(function(nv){if(!(ja.veiculos||[]).some(function(x){return x.placa&&nv.placa&&x.placa===nv.placa;})){ja.veiculos=(ja.veiculos||[]);ja.veiculos.push(nv);}});
      atualizados++;
    }else{DB.clientes.push(cli);novos++;}
  });
  save();closeM();go("clientes");
  toast("✅ Importação: "+novos+" cliente(s) novo(s)"+(atualizados?", "+atualizados+" atualizado(s)":"")+" — salvo!");
}

function fmtVal(v){
  if(v==null||v==="")return '<span class="no">—</span>';
  var s=String(v).trim(),l=s.toLowerCase();
  if(l==="sim")return '<span class="yes">✓ Sim</span>';
  if(l==="não"||l==="nao")return '<span class="nay">✗ Não</span>';
  var n=num(s);
  if(n!=null&&String(s).replace(/[\d.,\s%]/g,"")===""){
    if(/%$/.test(s))return esc(s);
    if(n<1&&n>0)return (n*100).toLocaleString("pt-BR")+"%";
    if(n>=1000)return brl(n);}
  return esc(s);
}

  if(!DB.fin.length)return h+'<div class="card" style="color:var(--muted)">Nenhum lançamento ainda. Registre aqui <b>tudo que entra e sai</b> — mensalidades recebidas, comissões das operadoras e despesas.</div>';

/* ====== IMPORTAÇÃO DO HISTÓRICO FINANCEIRO (colar do Excel ou CSV) ====== */
var IMPF={rows:[],headers:[]};
function abrirImportFin(){
  $("modalBox").className="modal wide";
  $("mtitle").textContent="Importar histórico financeiro";
  $("mbody").innerHTML=
    '<div class="alertbar" style="margin-bottom:12px">📋 Traga o seu controle antigo: abra a planilha no Excel, selecione as células (com a linha de título), copie (Ctrl+C) e <b>cole aqui embaixo</b>. Precisa ter pelo menos <b>uma coluna de DATA e uma de VALOR</b> — é a data que faz o filtro por mês funcionar.</div>'+
    '<div class="inp"><label>Cole aqui os dados copiados do Excel</label><textarea id="impfTxt" rows="6" placeholder="Cole aqui..." oninput="lerImportFin(this.value)"></textarea></div>'+
    '<div style="margin:9px 0"><button class="btn sm" onclick="$(\'fileImportFin\').click()">📁 …ou escolher arquivo CSV</button></div>'+
    '<div id="impfMap"></div>';
  $("mfoot").innerHTML='<button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" id="impfGo" style="display:none" onclick="fazImportFin()">⬇ Importar</button>';
  $("modal").classList.add("on");
}
function lerImportFin(txt){
  txt=(txt||"").replace(/\r/g,"");var linhas=txt.split("\n").filter(function(l){return l.trim();});
  if(linhas.length<1){$("impfMap").innerHTML="";$("impfGo").style.display="none";return;}
  var sep=linhas[0].indexOf("\t")>=0?"\t":(linhas[0].split(";").length>linhas[0].split(",").length?";":",");
  var rows=linhas.map(function(l){return splitLinha(l,sep);});
  var ncol=Math.max.apply(null,rows.map(function(r){return r.length;}));
  rows=rows.map(function(r){while(r.length<ncol)r.push("");return r;});
  IMPF.headers=rows[0];IMPF.rows=rows.slice(1);
  if(!IMPF.rows.length){IMPF.rows=rows;IMPF.headers=rows[0].map(function(_,i){return "Coluna "+(i+1);});}
  var CAMPOS=[["ignorar","(ignorar)"],["data","Data"],["desc","Descrição"],["cliente","Cliente"],["tipo","Tipo (entrada/saída/comissão)"],["valor","Valor R$"]];
  function adiv(hd){var h=hd.toLowerCase();
    if(/dat|venc|dia|m[eê]s/.test(h))return "data";
    if(/desc|hist|lan[cç]|refer|item/.test(h))return "desc";
    if(/client|coop|nome|raz/.test(h))return "cliente";
    if(/tipo|natur|entrada|sa[ií]da|d\s*\/\s*c|movim/.test(h))return "tipo";
    if(/valor|r\$|total|quantia/.test(h))return "valor";return "ignorar";}
  $("impfMap").innerHTML='<div class="section-title" style="margin:10px 0 8px"><span class="bar"></span>Diga o que é cada coluna <span class="hint">— eu já tentei adivinhar</span></div>'+
    '<div class="scrollx"><table class="ed" style="min-width:520px"><thead><tr>'+
    IMPF.headers.map(function(hd,i){return '<th><select class="impfSel" data-i="'+i+'" style="width:100%;padding:5px;border:1px solid var(--line);border-radius:7px;font-family:inherit;font-size:11.5px">'+
      CAMPOS.map(function(cp){return '<option value="'+cp[0]+'"'+(adiv(hd)===cp[0]?" selected":"")+'>'+cp[1]+'</option>';}).join("")+'</select><div class="mini" style="margin-top:3px">'+esc(hd)+'</div></th>';}).join("")+
    '</tr></thead><tbody>'+
    IMPF.rows.slice(0,4).map(function(r){return '<tr>'+r.map(function(cel){return '<td style="padding:6px;font-size:12px;color:#454c60">'+esc(cel)+'</td>';}).join("")+'</tr>';}).join("")+
    '</tbody></table></div><div class="mini" style="margin-top:6px">Mostrando as 4 primeiras linhas · total a importar: <b>'+IMPF.rows.length+'</b></div>';
  $("impfGo").style.display="inline-flex";
}
function fazImportFin(){
  var mapa=[].map.call(document.querySelectorAll(".impfSel"),function(s){return s.value;});
  var novos=0,pulados=0,semData=0;
  IMPF.rows.forEach(function(r){
    var o={};
    mapa.forEach(function(campo,i){if(campo==="ignorar")return;var val=(r[i]||"").trim();if(!val)return;o[campo]=val;});
    var data=parseDataBR(o.data);
    var valor=num(o.valor);
    if(valor==null){pulados++;return;}
    if(!data){semData++;return;}
    var tipo;
    var tl=(o.tipo||"").toLowerCase();
    if(/comiss/.test(tl))tipo="comissao";
    else if(/sa[ií]|desp|pag|d[eé]b/.test(tl))tipo="saida";
    else if(/entr|rec|cr[eé]d/.test(tl))tipo="entrada";
    else tipo=valor<0?"saida":"entrada";
    var desc=[o.desc,o.cliente].filter(Boolean).join(" — ")||"(importado)";
    var abs=Math.abs(valor);
    var ja=DB.fin.some(function(l){return l.data===data&&l.valor===abs&&l.desc===desc&&l.tipo===tipo;});
    if(ja){pulados++;return;}
    DB.fin.push({id:uid(),tipo:tipo,valor:abs,data:data,desc:desc});
    novos++;
  });
  save();closeM();go("fin");
  toast("✅ Histórico: "+novos+" lançamento(s) importado(s)"+(pulados?", "+pulados+" repetido(s)/sem valor pulado(s)":"")+(semData?", "+semData+" sem data (não entram no filtro — corrija a coluna de data)":""));
}
$("fileImportFin").addEventListener("change",function(){var f=this.files[0];if(!f)return;
  var r=new FileReader();r.onload=function(){$("impfTxt").value=r.result;lerImportFin(r.result);};r.readAsText(f,"utf-8");this.value="";});
